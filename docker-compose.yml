# VPS France (OVH Gravelines / Roubaix / Strasbourg).
# Pour Paris même, préférez Fly.io région cdg — voir README.
# Copiez vos secrets Streamlit Cloud dans un fichier `.env` (KEY=value).
services:
  api:
    build: .
    command: ["python", "scripts/run_api.py"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_POOL_MODE: session
    restart: unless-stopped
  web:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      DATABASE_POOL_MODE: session
      PORT: "8501"
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
