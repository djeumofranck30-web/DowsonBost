# VPS France (OVH Gravelines / Roubaix / Strasbourg).
# Pour Paris même, préférez Fly.io région cdg — voir README.
# Copiez vos secrets Streamlit Cloud dans un fichier `.env` (KEY=value).
services:
  web:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      DATABASE_POOL_MODE: session
      PORT: "8501"
    restart: unless-stopped
  # Optionnel — API REST séparée. Ne la reliez pas à Streamlit via API_BASE_URL
  # sur une petite machine : le hop HTTP ralentit chaque clic.
  api:
    build: .
    command: ["python", "scripts/run_api.py"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_POOL_MODE: session
    profiles: ["api"]
    restart: unless-stopped
