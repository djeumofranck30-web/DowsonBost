<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>DowsonBost — Flyer 10 Affiche QR</title>
  <link rel="stylesheet" href="../assets/shared.css" />
  <style>
    .flyer { display: grid; grid-template-rows: 1.05fr .95fr; }
    .gold {
      background: var(--gold);
      padding: 64px 64px 40px;
      display: flex;
      flex-direction: column;
    }
    .navy {
      background: var(--navy);
      color: #fff;
      padding: 48px 64px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    h1 { font-size: 88px; color: var(--navy); }
    .sub {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 600;
      color: #3f2e0a;
      max-width: 900px;
    }
    .qr-lg {
      width: 420px; height: 420px;
      background: #fff;
      border-radius: 28px;
      padding: 18px;
      object-fit: contain;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .scan {
      margin-top: 22px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .url { color: #fff; font-size: 26px; margin-top: 8px; }
    .fine { color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <article class="flyer">
    <div class="gold">
      <div class="mark">
        <div class="mark-sq">DB</div>
        <div class="mark-name">Dowson<span>Bost</span></div>
      </div>
      <div style="margin-top:auto">
        <div class="eyebrow" style="color:#7a5b0a">Affiche à scanner</div>
        <h1>Scannez.<br>Déposez.<br>Match.</h1>
        <p class="sub">Matching CV × offres par intelligence artificielle. Un QR, un compte, un meilleur premier envoi.</p>
      </div>
    </div>
    <div class="navy">
      <img class="qr-lg" src="../assets/qr-dark.png" alt="QR DowsonBost" />
      <div class="scan">Ouvrir l’app</div>
      <div class="url">dowsonbost.streamlit.app</div>
      <div class="fine">Analyse ATS · CV A4 · Lettre · Suivi des candidatures</div>
    </div>
  </article>
</body>
</html>
